# Tox (http://tox.testrun.org/) is a tool for running tests in multiple virtualenvs.
# This configuration file will run the test suite on all supported Python versions.
# To use it, "pip install tox" and then run "tox" from this directory.

# {posargs} can be passed in by additional arguments specified when invoking tox.
# Can be used to specify which tests to run, e.g.: tox -- -s


[tox]
envlist =
# Basic configuration: run the tests against the active Python interpreter.
# In CI a conda env (see conda/environment-sam3.yml) is activated before tox so
# that GDAL and the other native deps are available via system site-packages.
    py312

# Build and test the docs with sphinx.
    docs

# Run the linters.
    lint

# Pre distribution checks for the package
    twine

skip_missing_interpreters = false

[testenv]
# Inherit the active (conda) environment so that GDAL and related native
# packages installed via conda are visible to the test interpreter.
system_site_packages = true
deps =
    pytest==7.2.1
    pytest-cov==4.0.0
    pytest-xdist==3.2.0
    mock==5.0.1
    moto==5.0.14
setenv =
# MOTO/BOTO
    AWS_DEFAULT_REGION=us-west-2
    AWS_ACCESS_KEY_ID=testing
    AWS_SECRET_ACCESS_KEY=testing
    AWS_SECURITY_TOKEN=testing
    AWS_SESSION_TOKEN=testing
commands =
    pytest --cov-config .coveragerc --cov aws.osml --cov-report term-missing test/aws {posargs}
    {env:IGNORE_COVERAGE:} coverage report --rcfile .coveragerc
    {env:IGNORE_COVERAGE:} coverage html --rcfile .coveragerc

[testenv:twine]
deps =
    twine>=1.12.0
commands =
    python setup.py sdist
    twine check dist/*.tar.gz

[testenv:lint]
skip_install = true
deps = pre-commit
commands = pre-commit run --from-ref origin/main --to-ref HEAD --show-diff-on-failure

[testenv:docs]
changedir = doc
system_site_packages = true
usedevelop = true
deps =
    sphinx>=6.2.1
    sphinx-rtd-theme>=1.2.2
    sphinx-autoapi>=2.1.1
commands = sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
